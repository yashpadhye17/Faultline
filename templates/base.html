<!DOCTYPE html>
<html lang="en" data-page="{% block page_id %}home{% endblock %}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Reliability Copilot · EIRC{% endblock %}</title>
  <script>
    (function () {
      var theme = "light";
      try {
        theme = localStorage.getItem("eirc-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css?v=20260929p5" />
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div class="overlay-backdrop" id="overlay-backdrop" hidden></div>
  <aside class="panel-drawer" id="source-drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="panel-drawer-head">
      <h2 id="drawer-title">Sources</h2>
      <button type="button" class="btn btn-icon btn-ghost" data-panel-close aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel-drawer-body" id="drawer-body"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="/static/js/app.js?v=20260929p5"></script>
  <script src="/static/js/features.js?v=20260929p5"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
