# Continuous integration for Reliability Copilot (EIRC).
# Runs on every push / PR to main or develop.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            api \
            models \
            src \
            utils \
            logger \
            exception \
            main.py \
            scripts

      - name: Validate config YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("config/config.yaml").read_text())
          assert cfg["app"]["name"]
          assert cfg["embedding_model"]["model_name"]
          assert cfg["llm"]["model_name"]
          assert "answer_relevancy" in cfg["evaluation"]["metrics"]
          assert "faithfulness" not in cfg["evaluation"]["metrics"]
          print("config ok:", cfg["app"]["name"], cfg["app"]["version"])
          PY

      - name: Import FastAPI app (no API key required at import)
        env:
          GROQ_API_KEY: ci-placeholder-not-used-at-import
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from main import app
          routes = sorted({getattr(r, "path", None) for r in app.routes} - {None})
          for needed in ("/", "/healthz", "/readyz", "/metrics", "/rca", "/research"):
              assert needed in routes, f"missing route {needed}"
          print("routes ok:", len(routes))
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: eirc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
